<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>gun viewer</title>
<style>body{margin:0;background:#333}</style>
<script type="importmap">
  { "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const Q = new URLSearchParams(location.search);
const file = Q.get('gun') || 'rifle';
const view = Q.get('view') || 'side';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8899aa);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.01, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.3));
const dl = new THREE.DirectionalLight(0xfff2dd, 2.2); dl.position.set(2,3,2); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xaaccff, 0.7); dl2.position.set(-2,1,-2); scene.add(dl2);
new GLTFLoader().load(`./models/${file}.glb`, (g) => {
  const box = new THREE.Box3().setFromObject(g.scene);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  g.scene.position.sub(c);
  scene.add(g.scene);
  const d = Math.max(size.x, size.y, size.z) * 1.35;
  if (view === 'side') camera.position.set(d, size.y*0.25, 0);
  else if (view === 'top') camera.position.set(0, d, 0.001);
  else if (view === 'front') camera.position.set(0, 0.02, -d);
  else camera.position.set(d*0.7, d*0.35, d*0.6);
  camera.lookAt(0, 0, 0);
  window.__ready = true;
});
(function loop(){ requestAnimationFrame(loop); renderer.render(scene, camera); })();
</script>
</body>
</html>
